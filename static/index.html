<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학과 행사 아이디어 채팅</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:0 12px}
.err{color:#c00;min-height:1.2em}
#rooms li{cursor:pointer;padding:6px;border-bottom:1px solid #ddd}
#rooms li:hover{background:#f3f3f3}
#log{border:1px solid #ccc;height:300px;overflow-y:auto;padding:8px;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<h2>학과 행사 아이디어 채팅</h2>

<div id="lobby">
  <h3>채팅방 만들기</h3>
  <input id="roomName" placeholder="방 이름"> <button onclick="createRoom()">만들기</button>
  <div id="createErr" class="err"></div>

  <h3>채팅방 입장</h3>
  <input id="nick" placeholder="닉네임 입력 후 방 클릭">
  <div id="joinErr" class="err"></div>
  <ul id="rooms"></ul>
</div>

<div id="chat" class="hidden">
  <h3 id="roomTitle"></h3> <button onclick="leave()">나가기</button>
  <div id="log"></div>
  <input id="msg" placeholder="메시지" style="width:70%"> <button onclick="send()">전송</button>
  <div id="sendErr" class="err"></div>
</div>

<script>
let room = null, nick = "", count = 0, timer = null, busy = false;
const $ = id => document.getElementById(id);

async function api(url, opt) {
  const r = await fetch(url, opt);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "오류");
  return d;
}
const post = body => ({method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

async function loadRooms() {
  const list = await api("/api/rooms");
  $("rooms").innerHTML = "";
  list.forEach(r => {
    const li = document.createElement("li");
    li.textContent = `${r.name} (메시지 ${r.count})`;
    li.onclick = () => join(r);
    $("rooms").appendChild(li);
  });
}

async function createRoom() {
  $("createErr").textContent = "";
  try {
    await api("/api/rooms", post({name: $("roomName").value}));
    $("roomName").value = "";
    loadRooms();
  } catch (e) { $("createErr").textContent = e.message; }
}

function join(r) {
  nick = $("nick").value.trim();
  if (!nick) { $("joinErr").textContent = "닉네임을 입력하세요"; return; }
  $("joinErr").textContent = "";
  room = r; count = 0; $("log").innerHTML = "";
  $("roomTitle").textContent = `${r.name} — ${nick}`;
  $("lobby").classList.add("hidden");
  $("chat").classList.remove("hidden");
  poll();
  timer = setInterval(poll, 1000);
}

function leave() {
  clearInterval(timer); room = null;
  $("chat").classList.add("hidden");
  $("lobby").classList.remove("hidden");
  loadRooms();
}

async function poll() {
  if (!room || busy) return;
  busy = true;
  try {
    const msgs = await api(`/api/rooms/${room.id}/messages?after=${count}`);
    msgs.forEach(m => {
      const p = document.createElement("div");
      p.textContent = `[${m.time}] ${m.nickname}: ${m.text}`;
      $("log").appendChild(p);
    });
    count += msgs.length;
    if (msgs.length) $("log").scrollTop = $("log").scrollHeight;
  } catch (e) {} finally { busy = false; }
}

async function send() {
  $("sendErr").textContent = "";
  try {
    await api(`/api/rooms/${room.id}/messages`, post({nickname: nick, text: $("msg").value}));
    $("msg").value = "";
    poll();
  } catch (e) { $("sendErr").textContent = e.message; }
}

$("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
loadRooms();
setInterval(() => { if (!room) loadRooms(); }, 3000);
</script>
</body>
</html>
