<script>
// ===== 상태 =====
let ev = null;          // 지금 보고 있는 이벤트 (null이면 목록 화면)
let count = 0;          // 화면에 그린 번호표 수 → 서버에 after로 보냄
let myNumber = null;
let offset = 0;         // 서버 시각 - 내 컴퓨터 시각
let eventsCache = [];   // 마지막으로 받은 이벤트 목록
let version = -1;       // 마지막으로 받은 데이터 버전
let ctrl = null;        // 진행 중인 롱 폴링 요청을 취소하는 컨트롤러

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 서버 시각 기준으로 계산 (내 컴퓨터 시계가 틀려도 카운트다운이 맞도록)
const now = () => Date.now() / 1000 + offset;
const syncClock = serverNow => { offset = serverNow - Date.now() / 1000; };
const fmt = s => {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
};

// 내 번호표 기억 (서버를 다시 빌드하면 id가 재사용되므로 생성 시각까지 키에 포함)
const storeKey = e => `ticket-${e.id}-${e.created}`;
function saveTicket(e, d) { try { localStorage.setItem(storeKey(e), JSON.stringify(d)); } catch (_) {} }
function loadTicket(e) { try { return JSON.parse(localStorage.getItem(storeKey(e))); } catch (_) { return null; } }

async function api(url, opt) {
  const r = await fetch(url, opt);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "오류");
  return d;
}
const post = body => ({method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

// ===== 롱 폴링: 화면마다 루프는 하나만, 화면이 바뀌면 이전 요청은 취소 =====
function startLoop(loop) {
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  loop(ctrl.signal);
}

async function lobbyLoop(signal) {
  while (!signal.aborted) {
    try {
      const d = await api(`/api/events?version=${version}`, {signal});
      if (signal.aborted) return;
      syncClock(d.now);
      if (d.version !== version) {      // 바뀐 경우에만 다시 그림
        version = d.version;
        eventsCache = d.events;
        renderLobby();
      }
    } catch (e) {
      if (signal.aborted) return;
      await sleep(2000);                // 네트워크 오류 시 잠깐 쉬고 재시도
    }
  }
}

async function eventLoop(signal) {
  const id = ev.id;
  while (!signal.aborted) {
    try {
      const d = await api(`/api/events/${id}/tickets?after=${count}`, {signal});
      if (signal.aborted) return;
      syncClock(d.now);
      ev.closed_sec = d.closed_sec;
      if (d.tickets.length) appendTickets(d.tickets);
      updateStatus();
    } catch (e) {
      if (signal.aborted) return;
      await sleep(2000);
    }
  }
}

// ===== 목록 화면 =====
function updateStats(list) {
  const t = now();
  const open = list.filter(e => e.count < e.capacity && t >= e.open_at).length;
  const tickets = list.reduce((s, e) => s + e.count, 0);
  const records = list.map(e => e.closed_sec).filter(x => x !== null);
  $("sEvents").textContent = list.length;
  $("sOpen").textContent = open;
  $("sTickets").innerHTML = tickets + "<small>장</small>";
  $("sFast").innerHTML = records.length ? Math.min(...records).toFixed(2) + "<small>초</small>" : "-";
}

function renderLobby() {
  const list = eventsCache;
  updateStats(list);
  const box = $("events");
  box.innerHTML = "";
  if (!list.length) {
    const empty = el("div", "empty");
    empty.style.gridColumn = "1 / -1";
    empty.appendChild(el("div", "", "🎪"));
    empty.appendChild(el("p", "", "아직 열린 이벤트가 없어요. 왼쪽에서 첫 이벤트를 열어 보세요."));
    box.appendChild(empty);
    return;
  }
  const frag = document.createDocumentFragment();   // 한 번에 붙여서 화면 갱신 1회
  list.slice().reverse().forEach(e => {
    const full = e.count >= e.capacity;
    const waiting = now() < e.open_at;
    const ratio = e.count / e.capacity;
    const card = el("div", "ev" + (full ? " full" : waiting ? " soon" : ""));
    const head = el("div", "ev-head");
    head.appendChild(el("span", "ev-name", e.name));
    let label = "모집 중", cls = "";
    if (full) { label = "마감"; cls = " full"; }
    else if (waiting) { label = "오픈 예정"; cls = " soon"; }
    else if (ratio >= 0.7) { label = "마감 임박"; cls = " hot"; }
    head.appendChild(el("span", "badge" + cls, label));
    const num = el("div", "ev-num");
    num.textContent = e.count;
    num.appendChild(el("small", "", ` / ${e.capacity}명`));
    const bar = el("div", "bar");
    const fill = el("div", "fill" + (full ? " full" : ""));
    fill.style.width = Math.min(100, ratio * 100) + "%";
    bar.appendChild(fill);
    const foot = el("div", "ev-foot");
    const info = el("span", "", `남은 자리 ${e.capacity - e.count}`);
    if (full) info.textContent = e.closed_sec !== null ? `⚡ ${e.closed_sec.toFixed(2)}초 만에 마감` : "자리 없음";
    else if (waiting) { info.dataset.open = e.open_at; info.textContent = `⏰ ${fmt(e.open_at - now())} 후 오픈`; }
    foot.append(info, el("span", "", "입장 →"));
    card.append(head, num, bar, foot);
    card.onclick = () => enter(e);
    frag.appendChild(card);
  });
  box.appendChild(frag);
}

async function makeEvent() {
  $("createErr").textContent = "";
  try {
    await api("/api/events", post({name: $("eventName").value, capacity: $("capacity").value,
                                   open_in: $("openIn").value}));
    $("eventName").value = ""; $("capacity").value = ""; $("openIn").value = "0";
    // 목록은 롱 폴링이 자동으로 갱신하므로 다시 불러올 필요 없음
  } catch (e) { $("createErr").textContent = e.message; }
}

// ===== 이벤트 화면 =====
function showEmptyList() {
  $("list").innerHTML = "";
  const empty = el("div", "empty");
  empty.style.marginTop = "14px";
  empty.appendChild(el("div", "", "⏳"));
  empty.appendChild(el("p", "", "아직 아무도 뽑지 않았어요. 첫 번째 주인공이 되어 보세요!"));
  $("list").appendChild(empty);
}

function appendTickets(tickets) {
  if (count === 0) $("list").innerHTML = "";
  const frag = document.createDocumentFragment();
  tickets.forEach(t => {
    const row = el("div", "line");
    row.dataset.n = t.number;
    row.append(el("span", "num", t.number), el("span", "who", t.nickname), el("span", "when", t.time));
    frag.appendChild(row);
  });
  $("list").appendChild(frag);
  count += tickets.length;
  markMine();
  $("list").scrollTop = $("list").scrollHeight;
}

function showTicket(number, nick) {
  myNumber = number;
  $("myNum").textContent = number + "번";
  $("myName").textContent = nick + " 님";
  $("mine").classList.remove("hidden");
}

function updateOpen() {
  if (!ev) return;
  const waiting = now() < ev.open_at;
  const full = count >= ev.capacity;
  $("countdown").classList.toggle("hidden", !waiting);
  $("cdTime").textContent = fmt(ev.open_at - now());
  $("drawBtn").disabled = waiting || full;
  $("drawBtn").textContent = waiting ? "오픈 대기 중" : full ? "마감되었습니다" : "번호표 뽑기";
  if (!full) {
    $("status").textContent = waiting ? "오픈 예정" : "모집 중";
    $("status").className = "badge" + (waiting ? " soon" : "");
  }
}

function updateStatus() {
  const full = count >= ev.capacity;
  const pct = Math.min(100, Math.round(count / ev.capacity * 100));
  $("total").textContent = count;
  $("left").textContent = Math.max(0, ev.capacity - count);
  $("pct").textContent = pct + "%";
  $("prog").style.width = pct + "%";
  $("prog").className = "fill" + (full ? " full" : "");
  if (full) {
    $("status").textContent = "마감";
    $("status").className = "badge full";
    $("closedBanner").textContent = ev.closed_sec !== null && ev.closed_sec !== undefined
      ? `선착순 마감 · 오픈 후 ${ev.closed_sec.toFixed(2)}초 만에 마감됐어요`
      : "선착순 마감되었습니다";
  }
  $("closedBanner").classList.toggle("hidden", !full);
  updateOpen();
}

function markMine() {
  if (myNumber === null) return;
  const row = $("list").querySelector(`[data-n="${myNumber}"]`);
  if (row && !row.classList.contains("me")) {
    row.classList.add("me");
    row.appendChild(el("span", "me-tag", "나"));
  }
}

function enter(e, fromHistory) {
  if (!fromHistory) history.pushState({eid: e.id}, "", "#event-" + e.id);
  ev = e; count = 0; myNumber = null;
  showEmptyList();
  $("mine").classList.add("hidden");
  $("shareRow").classList.add("hidden");
  $("drawErr").textContent = "";
  $("cap").textContent = e.capacity;
  $("eventTitle").textContent = e.name;
  const saved = loadTicket(e);
  if (saved) { showTicket(saved.number, saved.nick); $("nick").value = saved.nick; }
  updateStatus();
  $("lobby").classList.add("hidden");
  $("event").classList.remove("hidden");
  startLoop(eventLoop);
}

function leave() {
  ev = null;
  $("event").classList.add("hidden");
  $("lobby").classList.remove("hidden");
  renderLobby();          // 저장해 둔 목록을 먼저 보여주고
  version = -1;           // 최신 목록을 바로 받아오도록
  startLoop(lobbyLoop);
}

// 목록 버튼: 방문 기록을 한 칸 되돌려 브라우저 뒤로 가기와 똑같이 동작
function goBack() {
  if (history.state && history.state.eid) history.back();
  else leave();
}

async function draw() {
  $("drawErr").textContent = "";
  try {
    const nick = $("nick").value.trim();
    const d = await api(`/api/events/${ev.id}/tickets`, post({nickname: nick}));
    showTicket(d.number, nick);
    saveTicket(ev, {number: d.number, nick: nick});
    markMine();           // 명단 갱신은 롱 폴링이 즉시 받아옴
  } catch (e) { $("drawErr").textContent = e.message; }
}

// 공유 링크 (http 주소에서는 클립보드 API가 막혀 있어서 execCommand로 복사)
function share() {
  const url = location.origin + "/#event-" + ev.id;
  $("shareBox").value = url;
  $("shareRow").classList.remove("hidden");
  $("shareBox").select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  $("shareMsg").textContent = ok ? "링크를 복사했어요. 단톡방에 붙여 넣으세요!" : "위 링크를 복사해서 공유하세요.";
}

// 카운트다운은 서버에 묻지 않고 화면에서 계산 (0초가 된 순간에만 목록을 다시 그림)
function tick() {
  if (ev) { updateOpen(); return; }
  let crossed = false;
  document.querySelectorAll("[data-open]").forEach(s => {
    const left = Number(s.dataset.open) - now();
    if (left <= 0) crossed = true;
    else s.textContent = `⏰ ${fmt(left)} 후 오픈`;
  });
  if (crossed) renderLobby();
}

window.addEventListener("popstate", e => {
  if (ev && !(e.state && e.state.eid)) leave();
});
$("nick").addEventListener("keydown", e => { if (e.key === "Enter" && !$("drawBtn").disabled) draw(); });
$("eventName").addEventListener("keydown", e => { if (e.key === "Enter") makeEvent(); });
setInterval(tick, 500);

// 시작: 공유 링크(#event-번호)로 들어왔으면 그 이벤트로 바로 입장
(async () => {
  const linked = location.hash.match(/^#event-(\d+)$/);
  history.replaceState(null, "", location.pathname);
  if (linked) {
    try {
      const e = await api(`/api/events/${linked[1]}`);
      syncClock(e.now);
      enter(e);
      return;
    } catch (_) {}
  }
  startLoop(lobbyLoop);
})();
</script>
