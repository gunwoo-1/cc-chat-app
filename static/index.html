<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선착순 번호표</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:20px auto;padding:0 12px}
.err{color:#c00;min-height:1.2em}
#events li{cursor:pointer;padding:6px;border-bottom:1px solid #ddd}
#events li:hover{background:#f3f3f3}
#list{border:1px solid #ccc;height:300px;overflow-y:auto;padding:8px;margin:8px 0}
#mine{font-size:1.3em;font-weight:bold;color:#06c;min-height:1.5em}
.hidden{display:none}
</style>
</head>
<body>
<h2>선착순 번호표</h2>

<div id="lobby">
  <h3>이벤트 만들기</h3>
  <input id="eventName" placeholder="이벤트 이름 (예: 발표 순서 정하기)"> <button onclick="createEvent()">만들기</button>
  <div id="createErr" class="err"></div>

  <h3>이벤트 목록 (클릭해서 입장)</h3>
  <ul id="events"></ul>
</div>

<div id="event" class="hidden">
  <h3 id="eventTitle"></h3> <button onclick="leave()">목록으로</button>
  <p>
    <input id="nick" placeholder="닉네임"> <button onclick="draw()">번호표 뽑기</button>
  </p>
  <div id="drawErr" class="err"></div>
  <div id="mine"></div>
  <h3>대기 명단 (<span id="total">0</span>명)</h3>
  <div id="list"></div>
</div>

<script>
let ev = null, count = 0, timer = null, busy = false;
const $ = id => document.getElementById(id);

async function api(url, opt) {
  const r = await fetch(url, opt);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "오류");
  return d;
}
const post = body => ({method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});

async function loadEvents() {
  const list = await api("/api/events");
  $("events").innerHTML = "";
  list.forEach(e => {
    const li = document.createElement("li");
    li.textContent = `${e.name} (대기 ${e.count}명)`;
    li.onclick = () => enter(e);
    $("events").appendChild(li);
  });
}

async function createEvent() {
  $("createErr").textContent = "";
  try {
    await api("/api/events", post({name: $("eventName").value}));
    $("eventName").value = "";
    loadEvents();
  } catch (e) { $("createErr").textContent = e.message; }
}

function enter(e) {
  ev = e; count = 0;
  $("list").innerHTML = ""; $("mine").textContent = ""; $("drawErr").textContent = "";
  $("total").textContent = "0";
  $("eventTitle").textContent = e.name;
  $("lobby").classList.add("hidden");
  $("event").classList.remove("hidden");
  poll();
  timer = setInterval(poll, 1000);
}

function leave() {
  clearInterval(timer); ev = null;
  $("event").classList.add("hidden");
  $("lobby").classList.remove("hidden");
  loadEvents();
}

async function poll() {
  if (!ev || busy) return;
  busy = true;
  try {
    const tickets = await api(`/api/events/${ev.id}/tickets?after=${count}`);
    tickets.forEach(t => {
      const p = document.createElement("div");
      p.textContent = `${t.number}번 — ${t.nickname} (${t.time})`;
      $("list").appendChild(p);
    });
    count += tickets.length;
    $("total").textContent = count;
    if (tickets.length) $("list").scrollTop = $("list").scrollHeight;
  } catch (e) {} finally { busy = false; }
}

async function draw() {
  $("drawErr").textContent = "";
  try {
    const d = await api(`/api/events/${ev.id}/tickets`, post({nickname: $("nick").value}));
    $("mine").textContent = `내 번호표: ${d.number}번`;
    poll();
  } catch (e) { $("drawErr").textContent = e.message; }
}

$("nick").addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
loadEvents();
setInterval(() => { if (!ev) loadEvents(); }, 3000);
</script>
</body>
</html>
